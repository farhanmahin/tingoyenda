<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডয়েল নিউজ - নিউজ ফটো কার্ড জেনারেটর</title>
    <!-- Professional Bengali Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@700;800&family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas Library for HD Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #e60000; /* Default Red Theme */
            --bg-body: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        header h1 {
            color: #d32f2f;
            font-size: 26px;
            font-weight: 700;
        }

        header p {
            color: #666;
            font-size: 14px;
            margin-top: 3px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            max-width: 1250px;
            margin: 20px auto;
            gap: 25px;
            padding: 0 15px;
            width: 100%;
            flex: 1;
        }

        /* Form Controls Section */
        .controls-section {
            flex: 1;
            min-width: 320px;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #111;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            background-color: #fafafa;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #d32f2f;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        /* File Upload styling */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            border: 2px dashed #bbb;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: 0.2s;
        }

        .file-upload-wrapper:hover {
            border-color: #d32f2f;
            background: #fff;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Color Theme Options */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .theme-btn {
            height: 40px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .theme-btn.active {
            border-color: #000;
            transform: scale(1.02);
        }

        .theme-red { background-color: #e60000; }
        .theme-blue { background-color: #0056b3; }
        .theme-green { background-color: #008744; }
        .theme-dark { background-color: #222222; }

        /* Zoom Controls */
        .img-adjust-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }

        .img-adjust-controls input[type="range"] {
            flex: 1;
        }

        /* Preview Section */
        .preview-section {
            flex: 1;
            min-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-container-wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
        }

        /* Main Photo Card Design */
        #newsCard {
            width: 100%;
            aspect-ratio: 1 / 1.15;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            border-radius: 4px;
        }

        /* Top 62% Image Area */
        .card-image-area {
            height: 62%;
            width: 100%;
            position: relative;
            background-color: #e9ecef;
            overflow: hidden;
        }

        .card-image-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center center;
        }

        /* PHOTO CARD FONTS ONLY */
        .category-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 4px 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 3px;
            z-index: 2;
            font-family: 'Hind Siliguri', sans-serif;
        }

        /* Middle Bar: Brand Logo */
        .brand-divider-bar {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 3;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
            text-align: center;
            font-family: 'Anek Bangla', sans-serif; /* Professional Newspaper Brand Font */
        }

        /* Bottom Text Area (White Background & Centered News Text) */
        .card-content-area {
            height: 38%;
            background-color: #ffffff;
            color: var(--text-color);
            padding: 16px 20px 10px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .news-text {
            font-size: 21px;
            line-height: 1.5;
            font-weight: 600;
            color: #111111;
            text-align: center;
            font-family: 'Noto Serif Bengali', 'Hind Siliguri', serif; /* Classic Bengali News Print Font */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: auto 0;
        }

        /* Card Footer */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eeeeee;
            padding-top: 8px;
            margin-top: 5px;
        }

        .website-url {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 14px;
            font-family: Arial, sans-serif;
            letter-spacing: 0.5px;
        }

        .news-date {
            font-size: 13px;
            color: #777777;
            font-family: 'Hind Siliguri', sans-serif;
        }

        /* Download Button */
        .download-btn {
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            background-color: #008744;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover {
            background-color: #006b35;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .card-container-wrapper {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ডয়েল নিউজ - ফটো কার্ড জেনারেটর</h1>
        <p>সহজেই পেশাদার সংবাদের ফটো কার্ড তৈরি ও এইচডি ডাউনলোড করুন</p>
    </header>

    <div class="main-container">
        <!-- Input Form Controls -->
        <div class="controls-section">
            <div class="section-title">কার্ড সেটিংস ও বিবরণ</div>
            
            <div class="form-group">
                <label for="newsInput">১. আপনার টেক্সটটি লিখুন (২-৩ লাইন)</label>
                <textarea id="newsInput" placeholder="এখানে আপনার সংবাদের বিস্তারিত লিখুন..."></textarea>
            </div>

            <div class="form-group">
                <label>২. ছবি আপলোড করুন</label>
                <div class="file-upload-wrapper">
                    <span id="uploadText">ছবি নির্বাচন করতে এখানে ক্লিক করুন</span>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                <!-- Image Adjust Controls -->
                <div class="img-adjust-controls">
                    <label style="margin:0; font-size:13px;">জুম:</label>
                    <input type="range" id="zoomRange" min="1" max="2" step="0.05" value="1">
                </div>
            </div>

            <div class="form-group">
                <label for="categoryInput">৩. ক্যাটাগরি / বিষয় (ঐচ্ছিক)</label>
                <input type="text" id="categoryInput" value="জাতীয়" placeholder="যেমন: জাতীয়, খেলাধুলো, বিনোদন">
            </div>

            <div class="form-group">
                <label>৪. থিম কালার নির্বাচন করুন</label>
                <div class="theme-grid">
                    <button class="theme-btn theme-red active" onclick="setTheme('#e60000', this)">লাল</button>
                    <button class="theme-btn theme-blue" onclick="setTheme('#0056b3', this)">নীল</button>
                    <button class="theme-btn theme-green" onclick="setTheme('#008744', this)">সবুজ</button>
                    <button class="theme-btn theme-dark" onclick="setTheme('#222222', this)">ডার্ক</button>
                </div>
            </div>

            <div class="form-group">
                <label for="dateInput">৫. তারিখ</label>
                <input type="text" id="dateInput" value="">
            </div>
        </div>

        <!-- Live Fit Screen Preview -->
        <div class="preview-section">
            <div class="section-title" style="width:100%; text-align:center;">কার্ড প্রিভিউ</div>
            
            <div class="card-container-wrapper">
                <div id="newsCard">
                    <!-- Top Image Section -->
                    <div class="card-image-area">
                        <span class="category-tag" id="cardCategory">জাতীয়</span>
                        <img id="cardImage" src="https://via.placeholder.com/600x400/e0e0e0/888888?text=%E0%A6%9B%E0%A6%BB%E0%A6%BF+%E0%A6%86%E0%A6%AA%E0%A6%B2%E0%A7%8B%E0%A6%A1+%E0%A6%95%E0%A6%B0%E0%A7%81%E0%A6%A8" alt="News Image">
                    </div>

                    <!-- Middle Branding Title -->
                    <div class="brand-divider-bar">
                        <div class="brand-title">ডয়েল নিউজ</div>
                    </div>

                    <!-- Bottom Content Section (White Background & Center Aligned) -->
                    <div class="card-content-area">
                        <div class="news-text" id="cardText">
                            <!-- ফাঁকা রাখা হয়েছে, ব্যবহারকারী লিখলে দেখাবে -->
                        </div>
                        <div class="card-footer">
                            <span class="website-url">doyelnews.com</span>
                            <span class="news-date" id="cardDate"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Download Button -->
            <button class="download-btn" onclick="downloadCard()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                এইচডি কার্ড ডাউনলোড করুন
            </button>
        </div>
    </div>

    <script>
        // Set Default Date in Bengali
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        const today = new Date().toLocaleDateString('bn-BD', options);
        document.getElementById('dateInput').value = today;
        document.getElementById('cardDate').innerText = today;

        // Dynamic Text Inputs Update
        document.getElementById('newsInput').addEventListener('input', function() {
            document.getElementById('cardText').innerText = this.value;
        });

        document.getElementById('categoryInput').addEventListener('input', function() {
            const catElem = document.getElementById('cardCategory');
            if (this.value.trim() === '') {
                catElem.style.display = 'none';
            } else {
                catElem.style.display = 'inline-block';
                catElem.innerText = this.value;
            }
        });

        document.getElementById('dateInput').addEventListener('input', function() {
            document.getElementById('cardDate').innerText = this.value;
        });

        // Image Upload & Zoom Logic
        const imageInput = document.getElementById('imageInput');
        const cardImage = document.getElementById('cardImage');
        const zoomRange = document.getElementById('zoomRange');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    cardImage.src = event.target.result;
                    document.getElementById('uploadText').innerText = file.name;
                };
                reader.readAsDataURL(file);
            }
        });

        zoomRange.addEventListener('input', function() {
            cardImage.style.transform = `scale(${this.value})`;
        });

        // Color Theme Changer
        function setTheme(color, btn) {
            document.documentElement.style.setProperty('--primary-color', color);
            
            // Remove active class from buttons
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(b => b.classList.remove('active'));
            
            // Add active class to clicked button
            btn.classList.add('active');
        }

        // HD Download Function using html2canvas
        function downloadCard() {
            const card = document.getElementById('newsCard');
            
            // Temporary scale up for HD quality download
            html2canvas(card, {
                scale: 2, // 2x high definition resolution
                useCORS: true,
                logging: false,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `doyelnews-card-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            });
        }
    </script>
</body>
    </html>
